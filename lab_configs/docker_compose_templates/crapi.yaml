  #     - MONGO_DB_PORT=27017
  #     - MONGO_DB_USER=admin
  #     - MONGO_DB_PASSWORD=crapisecretpassword
  #     - MONGO_DB_NAME=crapi
  #     - API_USER=admin@example.com
  #     - API_PASSWORD=Admin!123
  #     - OPENAPI_SPEC=/app/resources/crapi-openapi-spec.json
  #     - DEFAULT_MODEL=gpt-4o-mini
  #     - CHROMA_HOST=chromadb_{{ student_id }}
  #     - CHROMA_PORT=8000
  #     # - CHATBOT_OPENAI_API_KEY=
  #   depends_on:
  #     mongodb_{{ student_id }}:
  #       condition: service_healthy
  #     crapi-identity_{{ student_id }}:
  #       condition: service_healthy
  #     chromadb_{{ student_id }}:
  #       condition: service_healthy
  #   # ports:
  #   #  - "${LISTEN_IP:-127.0.0.1}:5002:5002"

  crapi-web_{{ student_id }}:
    container_name: '{{ student_id }}_{{ lab_id }}'
    image: crapi/crapi-web:${VERSION:-latest}
    ports:
      - "{{ web_port }}:80"
    labels:
      - 'lab_id={{ lab_id }}'
      - 'student_id={{ student_id }}'
    environment:
      - COMMUNITY_SERVICE=crapi-community_{{ student_id }}:${COMMUNITY_SERVER_PORT:-8087}
      - IDENTITY_SERVICE=crapi-identity_{{ student_id }}:${IDENTITY_SERVER_PORT:-8080}
      - WORKSHOP_SERVICE=crapi-workshop_{{ student_id }}:${WORKSHOP_SERVER_PORT:-8000}
      # - CHATBOT_SERVICE=crapi-chatbot_{{ student_id }}:${CHATBOT_SERVER_PORT:-5002}
      - MAILHOG_WEB_SERVICE=mailhog_{{ student_id }}:8025
      - TLS_ENABLED=${TLS_ENABLED:-false}
    depends_on:
      crapi-community_{{ student_id }}:
        condition: service_healthy
      crapi-identity_{{ student_id }}:
        condition: service_healthy
      crapi-workshop_{{ student_id }}:
        condition: service_healthy
    healthcheck:
      test: curl 0.0.0.0:80/health
      interval: 15s
      timeout: 15s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  postgresdb_{{ student_id }}:
    container_name: postgresdb_{{ student_id }}
    image: 'postgres:14'
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    #ports:
    #  - "${LISTEN_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 15s
      timeout: 15s
      retries: 15
    volumes:
      - postgresql-data_{{ student_id }}:/var/lib/postgresql/data/
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  mongodb_{{ student_id }}:
    container_name: mongodb_{{ student_id }}
    image: 'mongo:4.4'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: crapisecretpassword
    #ports:
    #  - "${LISTEN_IP:-127.0.0.1}:27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo mongodb:27017/test --quiet
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 20s
    volumes:
      - mongodb-data_{{ student_id }}:/data/db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # chromadb_{{ student_id }}:
  #   container_name: chromadb_{{ student_id }}
  #   image: 'chromadb/chroma:latest'
  #   environment:
  #     IS_PERSISTENT: 'TRUE'
  #   healthcheck:
  #     test: [ "CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000" ]
  #     interval: 15s
  #     timeout: 15s
  #     retries: 15
  #     start_period: 20s
  #   volumes:
  #     - chromadb-data_{{ student_id }}:/data
  #   # ports:
  #   #   - "${LISTEN_IP:-127.0.0.1}:8000:8000"

  mailhog_{{ student_id }}:
    user: root
    container_name: mailhog_{{ student_id }}
    image: crapi/mailhog:${VERSION:-latest}
    environment:
      MH_MONGO_URI: admin:crapisecretpassword@mongodb_{{ student_id }}:27017
      MH_STORAGE: mongodb
    #ports:
    #  - "127.0.0.1:1025:1025" # smtp server
    #  - "${LISTEN_IP:-127.0.0.1}:8025:8025" # Mail ui
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "8025" ]
      interval: 15s
      timeout: 15s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M

  api-mypremiumdealership_{{ student_id }}:
    container_name: api-mypremiumdealership_{{ student_id }}
    image: crapi/gateway-service:${VERSION:-latest}
    #ports:
    #  - "${LISTEN_IP:-127.0.0.1}:8443:443" # https
    healthcheck:
      test: bash -c 'echo -n "GET / HTTP/1.1\n\n" > /dev/tcp/127.0.0.1/443'
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 50M

volumes:
  mongodb-data_{{ student_id }}:
  postgresql-data_{{ student_id }}:
  # chromadb-data_{{ student_id }}: